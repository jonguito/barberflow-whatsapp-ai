<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#15191e">
  <meta name="description" content="BarberFlow — agenda, atendimento inteligente e operação da barbearia em um só lugar.">
  <title>BarberFlow — operação da barbearia</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <a class="brand" href="/" aria-label="BarberFlow início">
        <span class="brand-mark">B<span>F</span></span>
        <span class="brand-word">barber<span>flow</span><small>STUDIO OS</small></span>
      </a>
      <div class="side-label">OPERAÇÃO</div>
      <nav class="side-nav" aria-label="Navegação principal">
        <button class="nav-item active" data-nav="overview"><span class="nav-ico">◫</span> Visão geral</button>
        <button class="nav-item" data-nav="agenda"><span class="nav-ico">▦</span> Agenda <span class="nav-count" id="nav-count">0</span></button>
        <button class="nav-item" data-nav="inbox"><span class="nav-ico">◌</span> Conversas <span class="nav-dot" id="inbox-dot"></span></button>
        <button class="nav-item" data-nav="services"><span class="nav-ico">✂</span> Serviços</button>
        <button class="nav-item" data-nav="team"><span class="nav-ico">♙</span> Equipe</button>
        <button class="nav-item" data-nav="customers"><span class="nav-ico">◎</span> Clientes</button>
      </nav>
      <div class="sidebar-bottom">
        <a class="public-link" href="/agendar" target="_blank" rel="noreferrer"><span>↗</span> Abrir agendamento público</a>
        <div class="shop-switch">
          <div class="avatar shop-avatar">N</div>
          <div class="shop-info"><strong id="side-shop-name">NAVALHA / STUDIO</strong><small>Plano Studio · demonstração</small></div>
          <button class="more-btn" aria-label="Configurações" data-nav="settings">···</button>
        </div>
      </div>
    </aside>

    <main class="main-area">
      <header class="topbar">
        <div class="crumb"><span>Workspace</span><b>/</b><strong id="crumb-current">Visão geral</strong></div>
        <div class="top-actions">
          <span class="connection-pill" id="connection-pill"><i></i><span>checando conexões</span></span>
          <button class="icon-button" data-nav="settings" title="Configurações">⚙</button>
          <div class="avatar user-avatar" title="Equipe">N</div>
        </div>
      </header>
      <section class="page-content" id="page-content" aria-live="polite"></section>
    </main>
  </div>

  <div class="overlay hidden" id="modal-overlay" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <div class="modal-card"><div class="modal-head"><h2 id="modal-title"></h2><button class="close-btn" data-action="close-modal" aria-label="Fechar">×</button></div><div class="modal-body" id="modal-body"></div></div>
  </div>
  <div class="login-gate hidden" id="login-gate">
    <form class="login-card" id="login-form"><span class="brand-mark">B<span>F</span></span><p class="eyebrow">BARBERFLOW STUDIO OS</p><h1>Bem-vindo de volta.</h1><p class="muted">Entre para acessar a operação da barbearia.</p><label>Senha administrativa<input name="password" type="password" autocomplete="current-password" required autofocus></label><button class="button button-primary full-width">Entrar no painel <span>→</span></button><p class="form-error" id="login-error"></p></form>
  </div>
  <div class="toast-region" id="toast-region" aria-live="polite"></div>
  <script type="module" src="/app.js?v=2"></script>
</body>
</html>
